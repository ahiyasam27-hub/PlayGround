<title>Emberfall — The Lost Blade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Marcellus&display=swap');
:root{color-scheme:dark;--cream:#f6e8c9;--gold:#ffcb6b;--muted:#a9b5c5;--glass:rgba(15,26,43,.76)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2b;font-family:'DM Sans',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-height:280px;overflow:hidden;background:#17283b;isolation:isolate}canvas{display:block;width:100%;height:100%;image-rendering:auto}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,15,28,.26),transparent 25%,transparent 73%,rgba(9,15,27,.45));z-index:1}.hud{position:absolute;inset:0;z-index:2;pointer-events:none;color:var(--cream)}.brand{position:absolute;top:clamp(14px,3.8vh,34px);left:clamp(16px,4vw,48px);display:flex;align-items:center;gap:12px}.brand-mark{width:37px;height:37px;border:1px solid rgba(255,203,107,.65);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:20px;box-shadow:0 0 24px #ffc55b2a}.brand small{display:block;color:#cad2dc;font-size:9px;letter-spacing:.23em;font-weight:700}.brand strong{display:block;font:16px 'Marcellus',serif;letter-spacing:.1em;margin-top:3px}.status{position:absolute;top:clamp(15px,3.8vh,34px);right:clamp(16px,4vw,48px);display:flex;align-items:center;gap:10px}.panel{background:var(--glass);border:1px solid #ffffff20;backdrop-filter:blur(12px);box-shadow:0 8px 26px #050d1880}.health{padding:9px 13px;border-radius:12px;min-width:145px}.label{font-size:9px;letter-spacing:.19em;font-weight:800;color:#b8c5d1}.hearts{display:flex;gap:4px;margin-top:5px;font-size:16px;color:#ff796f;line-height:1}.hearts .empty{color:#596472}.collect{height:42px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.coin-icon{width:14px;height:14px;border-radius:50%;background:#ffca66;border:2px solid #ffe4a8;box-shadow:0 0 10px #ffc4568c}.pause{pointer-events:auto;color:#f5e8cf;border:1px solid #ffffff24;border-radius:12px;background:var(--glass);height:42px;width:42px;font-size:17px;cursor:pointer}.quest{position:absolute;left:clamp(16px,4vw,48px);top:94px;padding:10px 14px;border-left:2px solid var(--gold);font-size:11px;color:#dae0e5;letter-spacing:.03em;text-shadow:0 2px 6px #000}.quest b{display:block;font-size:9px;letter-spacing:.17em;color:var(--gold);margin-bottom:3px}.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(9,19,33,.28),rgba(8,15,28,.64));transition:opacity .25s}.center.hidden{opacity:0;pointer-events:none}.card{width:min(440px,88%);text-align:center;padding:clamp(22px,5vh,42px);border:1px solid #ffe5b538;border-radius:22px;background:linear-gradient(145deg,rgba(20,35,54,.96),rgba(15,26,43,.96));box-shadow:0 24px 80px #020711aa;position:relative}.card:before{content:'';position:absolute;inset:7px;border:1px solid #ffffff0d;border-radius:16px;pointer-events:none}.eyebrow{font-size:9px;letter-spacing:.3em;color:var(--gold);font-weight:800}.card h1{font:clamp(32px,6vw,48px) 'Marcellus',serif;line-height:1.04;margin:12px 0 8px;color:#fff0d4;text-shadow:0 3px 22px #ffc66a36}.card p{font-size:13px;line-height:1.65;color:#b7c3d0;margin:0 auto 20px;max-width:330px}.primary{border:0;border-radius:11px;background:linear-gradient(135deg,#ffd784,#e9a94f);color:#322417;font:800 12px 'DM Sans',sans-serif;letter-spacing:.13em;padding:13px 24px;min-width:164px;box-shadow:0 7px 20px #f4b85238;cursor:pointer}.primary:active{transform:translateY(1px)}.hint{margin-top:14px!important;font-size:10px!important;color:#8291a3!important}.mobile-controls{display:none;position:absolute;inset:auto 0 0;z-index:3;justify-content:space-between;align-items:end;padding:0 20px max(16px,env(safe-area-inset-bottom));pointer-events:none}.control-cluster{display:flex;gap:10px;align-items:center}.control{pointer-events:auto;width:58px;height:58px;border:1px solid #ffffff42;border-radius:50%;background:#1322379c;color:#f9edda;display:grid;place-items:center;font-size:22px;box-shadow:0 5px 16px #07111f68;backdrop-filter:blur(5px);touch-action:none}.control:active,.control.pressed{background:#ffcc6cbb;color:#172131;transform:scale(.96)}.control.small{width:50px;height:50px;font-size:18px}.control.jump{width:68px;height:68px;color:#ffda8b;font-weight:800}.control.attack{width:58px;height:58px;color:#ffa19a}.mobile-controls .movement{gap:9px}.toast{position:absolute;left:50%;top:26%;transform:translate(-50%,-8px);padding:10px 16px;border-radius:10px;background:#102035de;border:1px solid #ffdc9140;color:#ffe5b7;font-size:12px;letter-spacing:.04em;opacity:0;transition:.3s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.touch-hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:9px;color:#ffffff88;letter-spacing:.1em;pointer-events:none}.hidden{display:none!important}
@media (pointer:coarse),(max-width:760px){.shell{width:100vw;height:100dvh;min-height:0}.mobile-controls{display:flex}.brand{top:max(12px,env(safe-area-inset-top));left:14px}.brand-mark{width:31px;height:31px;font-size:17px}.brand strong{font-size:13px}.brand small{font-size:7px}.status{top:max(12px,env(safe-area-inset-top));right:12px;gap:6px}.health{padding:7px 9px;min-width:95px}.hearts{font-size:13px;margin-top:3px}.collect{height:36px;padding:0 9px;font-size:11px;gap:6px}.pause{height:36px;width:36px}.quest{top:68px;left:14px;font-size:9px;padding:7px 10px}.quest b{font-size:8px}.touch-hint{display:none}.card{width:min(380px,88%);padding:25px 20px}.card h1{font-size:36px}.card p{font-size:12px}}
@media (max-height:430px) and (pointer:coarse){.brand,.status{top:7px}.quest{top:55px}.mobile-controls{padding-bottom:8px}.control{width:49px;height:49px}.control.jump{width:57px;height:57px}.card{padding:14px 20px}.card h1{font-size:30px;margin:6px 0}.card p{margin-bottom:10px}}
</style>

<body>
<main class="shell" id="shell">
<canvas id="game" aria-label="Emberfall platform adventure game"></canvas><div class="vignette"></div>
<div class="hud">
<div class="brand"><div class="brand-mark">✦</div><div><small>AN ADVENTURE BEGINS</small><strong>EMBERFALL</strong></div></div>
<div class="status"><div class="health panel"><div class="label">VITALITY</div><div class="hearts" id="hearts">♥♥♥</div></div><div class="collect panel"><span class="coin-icon"></span><span id="coinCount">0</span></div><button class="pause" id="pause" aria-label="Pause">Ⅱ</button></div>
<div class="quest"><b>THE OLD TRAIL</b>Find the forest gate <span style="color:#ffcb6b">◆</span></div>
<div class="toast" id="toast"></div>
<div class="center" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">A LOST KINGDOM</div><h1 id="title">The Lost Blade</h1><p id="message">A quiet forest. A forgotten path. Your journey to the Emberfall ruins starts here.</p><button class="primary" id="start">BEGIN JOURNEY</button><p class="hint" id="hint">Move with <b>← →</b> or <b>A / D</b> · Jump with <b>SPACE</b> · Strike with <b>J</b></p></div></div>
</div>
<div class="mobile-controls" id="mobileControls"><div class="control-cluster movement"><button class="control small" data-key="left" aria-label="Move left">‹</button><button class="control small" data-key="right" aria-label="Move right">›</button></div><div class="control-cluster"><button class="control attack" data-key="attack" aria-label="Sword attack">⚔</button><button class="control jump" data-key="jump" aria-label="Jump">↑</button></div></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),shell=document.getElementById('shell');
const ui={overlay:document.getElementById('overlay'),title:document.getElementById('title'),message:document.getElementById('message'),eyebrow:document.getElementById('eyebrow'),hint:document.getElementById('hint'),start:document.getElementById('start'),hearts:document.getElementById('hearts'),coins:document.getElementById('coinCount'),pause:document.getElementById('pause'),toast:document.getElementById('toast')};
let W=960,H=540,dpr=1,scale=1,camX=0,last=0,elapsed=0,toastTimer=0,screen='title',audio=null;
const world={width:3180,height:720,ground:460};
const keys={left:false,right:false,jump:false,attack:false};
let hero,enemies,coins,particles,checkpoints,gate,camTargetX=0,wasJump=false,wasAttack=false;
const platforms=[{x:0,y:460,w:390,h:120},{x:450,y:415,w:130,h:18},{x:625,y:375,w:120,h:18},{x:790,y:460,w:360,h:120},{x:1020,y:395,w:125,h:18},{x:1225,y:350,w:140,h:18},{x:1410,y:460,w:410,h:120},{x:1580,y:390,w:150,h:18},{x:1850,y:430,w:300,h:120},{x:1990,y:365,w:125,h:18},{x:2200,y:460,w:400,h:120},{x:2390,y:390,w:140,h:18},{x:2650,y:460,w:530,h:120}];
function resize(){const r=shell.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);W=r.width;H=r.height;scale=Math.max(W/960,H/540);}
window.addEventListener('resize',resize);resize();
function reset(){hero={x:75,y:400,vx:0,vy:0,w:27,h:46,face:1,onGround:false,hp:3,invuln:0,attack:0,attackCd:0,checkpoint:0};enemies=[{x:300,y:0,home:300,vx:0,hp:2,alive:true},{x:900,y:0,home:900,vx:0,hp:2,alive:true},{x:1085,y:0,home:1085,vx:0,hp:2,alive:true},{x:1640,y:0,home:1640,vx:0,hp:2,alive:true},{x:2060,y:0,home:2060,vx:0,hp:2,alive:true},{x:2470,y:0,home:2470,vx:0,hp:2,alive:true}];coins=[{x:320,y:395},{x:515,y:350},{x:682,y:310},{x:1070,y:330},{x:1295,y:290},{x:1650,y:330},{x:2048,y:305},{x:2450,y:330},{x:2760,y:405},{x:2840,y:405}].map(c=>({...c,taken:false}));particles=[];checkpoints=[{x:830,y:460,active:false},{x:1880,y:430,active:false}];gate={x:2990,y:370};camX=0;elapsed=0;updateHUD();}
reset();
function updateHUD(){ui.hearts.innerHTML=Array.from({length:3},(_,i)=>`<span class="${i>=hero.hp?'empty':''}">♥</span>`).join('');ui.coins.textContent=coins.filter(c=>c.taken).length;}
function showToast(text){ui.toast.textContent=text;ui.toast.classList.add('show');toastTimer=1.8;}
function begin(){if(screen==='dead'||screen==='win')reset();screen='playing';ui.overlay.classList.add('hidden');last=performance.now();}
ui.start.addEventListener('click',()=>{if(screen==='playing'){screen='playing';ui.overlay.classList.add('hidden');return}begin();});
function pauseGame(){if(screen==='playing'){screen='paused';ui.eyebrow.textContent='TAKE A BREATH';ui.title.textContent='Journey Paused';ui.message.textContent='Your adventure is waiting. The forest will be right where you left it.';ui.start.textContent='RESUME';ui.hint.textContent='Your progress is saved for this journey';ui.overlay.classList.remove('hidden')}else if(screen==='paused'){begin()}}
ui.pause.addEventListener('click',pauseGame);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','arrowdown'].includes(k))e.preventDefault();if(k==='escape'){pauseGame();return}if(k==='enter'&&screen!=='playing'){begin();return}if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '||k==='arrowup'||k==='w')keys.jump=true;if(k==='j'||k==='x')keys.attack=true;});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' '||k==='arrowup'||k==='w')keys.jump=false;if(k==='j'||k==='x')keys.attack=false;});
document.querySelectorAll('[data-key]').forEach(btn=>{const key=btn.dataset.key;const down=e=>{e.preventDefault();keys[key]=true;btn.classList.add('pressed');};const up=e=>{e.preventDefault();keys[key]=false;btn.classList.remove('pressed')};btn.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,up));});
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function seeded(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#192a42');g.addColorStop(.48,'#49647a');g.addColorStop(1,'#e1a16d');rect(0,0,W,H,g);
// distant haze and high clouds
const sunX=W*.73-camX*.025,sunY=H*.28;const glow=ctx.createRadialGradient(sunX,sunY,5,sunX,sunY,W*.4);glow.addColorStop(0,'#ffe9b47a');glow.addColorStop(.2,'#ffd9a133');glow.addColorStop(1,'#ffd9a100');rect(0,0,W,H,glow);circle(sunX,sunY,Math.min(W,H)*.055,'#ffe7b0');
for(let layer=0;layer<3;layer++){const parallax=.035+layer*.045,base=H*(.58+layer*.085),color=['#667b83','#405a62','#293f4a'][layer],step=190+layer*55;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);for(let x=-step;x<=W+step;x+=step){const wx=(x+camX*parallax+world.width*4)%(W+step*2)-step;const peak=base-65-seeded(Math.floor((x+camX*parallax)/step)+layer*17)*100;ctx.lineTo(wx,base);ctx.lineTo(wx+step*.5,peak);ctx.lineTo(wx+step,base)}ctx.lineTo(W,H);ctx.closePath();ctx.fill();}
// floating ember motes
for(let i=0;i<24;i++){let x=(seeded(i+5)*W-camX*.09+elapsed*(4+seeded(i)*8))%W,y=H*(.22+seeded(i+40)*.55)+Math.sin(elapsed*.7+i)*8;circle((x+W)%W,y,1+seeded(i+99)*1.5,`rgba(255,218,156,${.2+seeded(i+6)*.35})`)} }
function drawTree(x,y,s,shade){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rect(-9,-54,18,55,'#46382e');rect(-17,-18,8,7,'#594333');circle(0,-72,30,shade);circle(-18,-57,19,shade);circle(18,-56,20,shade);circle(0,-94,18,shade);ctx.restore()}
function drawWorld(){drawSky();ctx.save();ctx.scale(scale,scale);const viewW=W/scale,viewH=H/scale;const offsetY=(viewH-540)/2;
ctx.translate(0,offsetY);
// parallax forest silhouettes
for(let i=0;i<18;i++){const x=((i*197-camX*.25)%(world.width+300)+world.width+300)%(world.width+300)-80;if(x<viewW+70)drawTree(x,460,1.05+seeded(i)*.45,['#354c50','#3b5350','#34494b'][i%3]);}
// sunlit haze strips
const haze=ctx.createLinearGradient(0,260,0,480);haze.addColorStop(0,'#ffdea000');haze.addColorStop(1,'#ffcf7a24');rect(0,260,viewW,220,haze);
ctx.save();ctx.translate(-camX,0);
// ground / floating platforms
for(const p of platforms){rect(p.x,p.y,p.w,p.h,'#493f39');rect(p.x,p.y,p.w,9,'#817353');rect(p.x,p.y,p.w,4,'#a9a078');for(let i=0;i<p.w/26;i++){const xx=p.x+i*26;rect(xx,p.y+12,1,Math.min(30,p.h-12),'#59473b');if(seeded(Math.floor(xx)+2)>.5){rect(xx+5,p.y+24,6,3,'#635143')}}
for(let i=0;i<p.w/23;i++){const xx=p.x+i*23;rect(xx+3,p.y-4,9,4,['#789064','#8a986b','#687f5e'][i%3])}}
// glowing checkpoint stones
checkpoints.forEach(cp=>{rect(cp.x,cp.y-31,7,31,cp.active?'#fbdc86':'#84928a');circle(cp.x+3,cp.y-36,7,cp.active?'#ffd77c':'#bcc5a0');if(cp.active){ctx.globalAlpha=.35+Math.sin(elapsed*5)*.12;circle(cp.x+3,cp.y-36,16,'#ffdb7d');ctx.globalAlpha=1}});
// gate / destination
ctx.fillStyle='#192e39';ctx.beginPath();ctx.moveTo(gate.x-42,460);ctx.lineTo(gate.x-36,359);ctx.quadraticCurveTo(gate.x,305,gate.x+36,359);ctx.lineTo(gate.x+42,460);ctx.closePath();ctx.fill();ctx.strokeStyle='#c3975c';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#ffcf79';ctx.globalAlpha=.45+.3*Math.sin(elapsed*3);ctx.beginPath();ctx.ellipse(gate.x,420,21,49,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// coins
for(const c of coins)if(!c.taken){const bob=Math.sin(elapsed*4+c.x)*4;circle(c.x,c.y+bob,9,'#9b682d');circle(c.x,c.y+bob,7,'#ffd36f');circle(c.x-2,c.y+bob-2,2,'#fff0bd');rect(c.x-1,c.y+bob-4,2,8,'#e7a443')}
// enemies
for(const e of enemies)if(e.alive){const bob=Math.abs(Math.sin(elapsed*7+e.home)) * 3;ctx.save();ctx.translate(e.x,e.y-bob);ctx.fillStyle='#477755';ctx.beginPath();ctx.ellipse(0,-14,17,14,0,Math.PI,0);ctx.lineTo(17,-4);ctx.quadraticCurveTo(0,4,-17,-4);ctx.fill();ctx.fillStyle='#a5d17b';ctx.beginPath();ctx.ellipse(-4,-13,2.4,3.8,0,0,Math.PI*2);ctx.ellipse(5,-13,2.4,3.8,0,0,Math.PI*2);ctx.fill();circle(-3,-13,1.3,'#162a27');circle(6,-13,1.3,'#162a27');line(-7,-5,-3,-4,'#294a37',1.5);line(3,-4,7,-5,'#294a37',1.5);if(e.hp<2){roundRect(-12,-34,24,3,2,'#1c2a2a');roundRect(-12,-34,12,3,2,'#f1ba6b')}ctx.restore()}
drawHero();
// ambient foreground grass blades
for(let i=0;i<95;i++){const x=(i*51+camX*.12)%viewW,y=460+seeded(i+130)*11;line(x,y,x-3+Math.sin(elapsed+i)*2,y-9-seeded(i+1)*8,'#64724d',1.5)}
ctx.restore();ctx.restore();
}
function drawHero(){const h=hero;ctx.save();ctx.translate(h.x+h.w/2,h.y+h.h);ctx.scale(h.face,1);const blink=h.invuln>0&&Math.floor(elapsed*15)%2===0;if(blink)ctx.globalAlpha=.4;
// legs and little boots
const run=Math.sin(elapsed*17)*2.5*(Math.abs(h.vx)>20?1:0);roundRect(-9,-12+run,7,13,3,'#263342');roundRect(1,-12-run,7,13,3,'#263342');roundRect(-11,-3+run,10,5,2,'#a76543');roundRect(0,-3-run,10,5,2,'#a76543');
// cloak silhouette
ctx.fillStyle='#bd5142';ctx.beginPath();ctx.moveTo(-9,-39);ctx.quadraticCurveTo(-15,-26,-12,-12);ctx.lineTo(10,-11);ctx.lineTo(8,-38);ctx.closePath();ctx.fill();ctx.fillStyle='#833e3a';ctx.beginPath();ctx.moveTo(-8,-16);ctx.lineTo(10,-15);ctx.lineTo(8,-11);ctx.lineTo(-12,-11);ctx.fill();
// tunic / arm
roundRect(-5,-38,15,20,4,'#e0ad68');roundRect(-1,-33,13,5,2,'#f0c47b');circle(5,-46,9,'#d99b69');
// hair
ctx.fillStyle='#52372f';ctx.beginPath();ctx.arc(4,-48,9,Math.PI,Math.PI*2);ctx.lineTo(12,-44);ctx.lineTo(6,-45);ctx.lineTo(1,-42);ctx.closePath();ctx.fill();circle(8,-47,1.2,'#1b2430');
// sword arm and weapon
line(7,-31,17,-28,'#d89f70',4);if(h.attack>0){const progress=1-h.attack/.24;ctx.save();ctx.rotate(-.8+progress*1.7);line(13,-28,39,-31,'#e6e9df',4);line(13,-28,20,-28,'#9c7041',3);ctx.strokeStyle=`rgba(255,240,185,${.55*(1-progress)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(10,-28,33,-1.2,.7);ctx.stroke();ctx.restore()}else{line(14,-28,31,-34,'#e7e5d6',3);line(14,-28,20,-29,'#9d7043',3)}ctx.restore();}
function burst(x,y,color,count=8){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*140,vy:-30-Math.random()*130,life:.35+Math.random()*.5,color,size:2+Math.random()*3})}
function update(dt){elapsed+=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)ui.toast.classList.remove('show')}
if(screen!=='playing')return;
const h=hero;const accel=keys.left?-1:keys.right?1:0;if(accel)h.face=accel;h.vx+=accel*1050*dt;if(!accel)h.vx*=Math.pow(.001,dt);h.vx=Math.max(-225,Math.min(225,h.vx));if(keys.jump&&!wasJump&&h.onGround){h.vy=-470;h.onGround=false;burst(h.x+h.w/2,h.y+h.h,'#d7c38c',4)}wasJump=keys.jump;
if(keys.attack&&!wasAttack&&h.attackCd<=0){h.attack=.24;h.attackCd=.34}wasAttack=keys.attack;if(h.attack>0)h.attack=Math.max(0,h.attack-dt);if(h.attackCd>0)h.attackCd-=dt;if(h.invuln>0)h.invuln-=dt;
h.vy=Math.min(800,h.vy+1250*dt);const oldBottom=h.y+h.h;h.x=Math.max(0,Math.min(world.width-h.w,h.x+h.vx*dt));h.y+=h.vy*dt;h.onGround=false;
for(const p of platforms){if(h.x+h.w>p.x&&h.x<p.x+p.w&&oldBottom<=p.y+4&&h.y+h.h>=p.y&&h.vy>=0){h.y=p.y-h.h;h.vy=0;h.onGround=true}}
if(h.y>800){hurt(true)}
for(const c of coins){if(!c.taken&&Math.abs((h.x+h.w/2)-c.x)<21&&Math.abs((h.y+h.h/2)-c.y)<25){c.taken=true;burst(c.x,c.y,'#ffd36f',10);updateHUD();showToast('A little treasure for the road') }}
for(const cp of checkpoints){if(!cp.active&&h.x>cp.x-10&&h.x<cp.x+42){cp.active=true;h.checkpoint=cp.x;showToast('Campfire found · progress saved');burst(cp.x,cp.y-30,'#ffd47d',12)}}
for(const e of enemies){if(!e.alive)continue;e.y=platforms.find(p=>e.home>=p.x&&e.home<p.x+p.w)?.y||460;e.y-=0;e.x+=Math.sign((h.x-e.x)||1)*Math.min(26*dt,Math.abs(h.x-e.x)*.12*dt);e.x=Math.max(e.home-80,Math.min(e.home+80,e.x));
const near=Math.abs((h.x+h.w/2)-e.x)<30&&Math.abs((h.y+h.h)-e.y)<40;if(h.attack>0&&near){e.hp--;e.x+=h.face*18;burst(e.x,e.y-16,'#a8da8e',7);h.attack=0;if(e.hp<=0){e.alive=false;burst(e.x,e.y-15,'#8bd17d',14);showToast('Forest slime defeated')}}else if(near&&h.invuln<=0)hurt(false)}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
const target=Math.max(0,Math.min(world.width-W/scale,h.x+h.w/2-W/(scale*2)));camX+=(target-camX)*Math.min(1,dt*4.5);
if(h.x>gate.x-26){screen='win';ui.eyebrow.textContent='THE FIRST CHAPTER';ui.title.textContent='The path is open';ui.message.textContent=`You found the old forest gate with ${coins.filter(c=>c.taken).length} of ${coins.length} ember coins. Beyond it, the ruins are calling.`;ui.start.textContent='PLAY AGAIN';ui.hint.textContent='A new adventure waits beyond the gate';ui.overlay.classList.remove('hidden')}
}
function hurt(fall){if(hero.invuln>0)return;hero.hp--;hero.invuln=1.35;hero.vy=fall?-100:-230;hero.vx=fall?0:-hero.face*145;if(fall){hero.x=hero.checkpoint||70;hero.y=world.ground-hero.h;hero.vy=0}updateHUD();burst(hero.x+hero.w/2,hero.y+hero.h/2,'#ff7b69',8);if(hero.hp<=0){screen='dead';ui.eyebrow.textContent='THE FOREST CLAIMS ANOTHER';ui.title.textContent='Not the end';ui.message.textContent='Every blade can rise again. Your journey will begin at the forest edge.';ui.start.textContent='TRY AGAIN';ui.hint.textContent='Tip: strike a slime with ⚔, and keep moving';ui.overlay.classList.remove('hidden')}}
function drawParticles(){ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,0);for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);circle(p.x,p.y,p.size,p.color)}ctx.globalAlpha=1;ctx.restore()}
function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);ctx.setTransform(dpr,0,0,dpr,0,0);drawWorld();drawParticles();requestAnimationFrame(frame)}requestAnimationFrame(frame);
// tiny synthesized sword/ambience sound is intentionally opt-in
})();
</script>
